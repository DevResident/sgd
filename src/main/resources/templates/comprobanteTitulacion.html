<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Comprobante de Inscripción — Opción de Titulación</title>
    <link rel="stylesheet" th:href="@{/css/documento.css}">
    <link rel="stylesheet" th:href="@{/css/titulacion.css}">
</head>
<body>

<header class="doc-header">
    <div class="doc-header__logo doc-header__logo--left">
        <img th:src="@{/img/unam_logo.png}" alt="Escudo UNAM">
    </div>

    <div class="doc-header__titles">
        <p class="doc-header__line doc-header__line--uni">UNIVERSIDAD NACIONAL AUT&Oacute;NOMA DE M&Eacute;XICO</p>
        <p class="doc-header__line">FACULTAD DE CONTADUR&Iacute;A Y ADMINISTRACI&Oacute;N</p>
        <p class="doc-header__line">SECRETAR&Iacute;A GENERAL</p>
        <p class="doc-header__line doc-header__line--strong">EX&Aacute;MENES PROFESIONALES</p>
        <p class="doc-header__line doc-header__line--strong">REGISTRO EN L&Iacute;NEA</p>
    </div>

    <div class="doc-header__logo doc-header__logo--right">
        <img th:src="@{/img/fca_logo.png}" alt="Logo FCA">
    </div>
</header>

<hr class="doc-separator"/>

<table class="tit-table">
    <tr>
        <th>N&uacute;mero de Cuenta:</th>
        <td th:text="${reg.numeroCuenta}"></td>
    </tr>
    <tr>
        <th>Nombre del Alumno:</th>
        <td th:text="${reg.nombre}"></td>
        <td th:text="${reg.primerApellido}"></td>
        <td th:text="${reg.segundoApellido}"></td>
    </tr>
    <tr>
        <th>Universidad:</th>
        <td th:text="${reg.universidadProcedencia}"></td>
    </tr>
    <tr>
        <th>Plantel:</th>
        <td th:text="${reg.plantelProcedencia}"></td>
    </tr>
    <tr>
        <th>Licenciatura:</th>
        <td th:text="${reg.licenciatura}"></td>
    </tr>
    <tr>
        <th>Opci&oacute;n de Titulaci&oacute;n:</th>
        <td th:text="${reg.opcionTitulacion}"></td>
    </tr>
    <tr>
        <th>Modalidad:</th>
        <td th:text="${reg.modalidad}"></td>
    </tr>
    <tr>
        <th>Fecha de aplicaci&oacute;n:</th>
        <td th:text="${reg.fechaAplicacion}"></td>
    </tr>
    <tr>
        <th>Fecha de registro:</th>
        <td th:text="${reg.fechaRegistro}"></td>
    </tr>
</table>

</body>
</html>
