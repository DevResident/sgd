<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Comprobante de Inscripción — Opción de Titulación</title>
    <link href="header.css" rel="stylesheet" type="text/css"/>
    <link href="titulacion.css" rel="stylesheet" type="text/css"/>
</head>
<body>

<header class="doc-header">
    <div class="doc-header__logo doc-header__logo--left">
        <img src="../static/img/unam.png" alt="logo unam"/>
    </div>

    <div class="doc-header__titles">
        <p class="doc-header__line doc-header__line--uni" th:text="${T(fca.cifca.sgd.util.ConstantesUtil).UNAM}"></p>
        <p class="doc-header__line" th:text="${T(fca.cifca.sgd.util.ConstantesUtil).FCA}"></p>
        <p class="doc-header__line" th:text="${T(fca.cifca.sgd.util.ConstantesUtil).SECRETARÍAGENERAL}"></p>
        <p class="doc-header__line doc-header__line--strong" th:text="${T(fca.cifca.sgd.util.ConstantesUtil).EXAMENESPROFESIONALES}"></p>
        <p class="doc-header__line doc-header__line--strong" th:text="${T(fca.cifca.sgd.util.ConstantesUtil).ONLINE}"></p>
    </div>

    <div class="doc-header__logo doc-header__logo--right">
        <img src="../static/img/yaca.png" alt="logo yaca"/>
    </div>
</header>

<hr class="doc-separator"/>

<table class="tit-table">
    <tbody>
    <tr>
        <th>Número de Cuenta:</th>
        <td th:text="${documento.numeroCuenta}">__</td>
    </tr>
    <tr>
        <th>Nombre del Alumno:</th>
        <td colspan="3"
            th:text="${documento.nombre + ' ' + documento.primerApellido + ' ' + documento.segundoApellido}">
        </td>
    </tr>
    <tr>
        <th>Universidad:</th>
        <td th:text="${documento.universidadProcedencia}">__</td>
    </tr>
    <tr>
        <th>Plantel:</th>
        <td th:text="${documento.plantelProcedencia}">__</td>
    </tr>
    <tr>
        <th>Licenciatura:</th>
        <td th:text="${documento.licenciatura}">__</td>
    </tr>
    <tr>
        <th>Opción de Titulación:</th>
        <td th:text="${documento.opcionTitulacion}">__</td>
    </tr>
    <tr>
        <th>Modalidad:</th>
        <td th:text="${documento.modalidad}">__</td>
    </tr>
    <tr>
        <th>Fecha de registro:</th>
        <td th:text="${#temporals.format(documento.fechaRegistro, 'dd/MM/yyyy')}">__</td>
    </tr>
    </tbody>
</table>

</body>
</html>
